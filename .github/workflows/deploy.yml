name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: yencloud

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ALLOWED_HOSTS: "localhost,127.0.0.1,13.60.72.108,dieuyen1807.com,www.dieuyen1807.com"
        run: |
          COMMANDS=$(cat <<EOF
            set -e
            echo "=== Pulling new image ==="
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY
            docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

            echo "=== Restarting container ==="
            docker stop yencloud || true
            docker rm yencloud || true
            docker run -d --name yencloud --network host \
              -e NODE_ENV=production \
              -e ALLOWED_HOSTS="${{ env.ALLOWED_HOSTS }}" \
              -e SSM_PARAMETER_PATH=/yencloud/production \
              -e AWS_REGION=${{ env.AWS_REGION }} \
              --restart unless-stopped \
              $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

            echo "=== Verifying ==="
            sleep 3
            curl -sf http://localhost:5000/api/health || echo "Health check failed, checking logs..."
            docker logs yencloud --tail 10
          EOF
          )

          aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="$COMMANDS" \
            --comment "Deploy yencloud ${{ github.sha }}" \
            --output text
